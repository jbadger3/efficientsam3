BASE: ['../base_stage1.yaml']

DATA:
  IMG_SIZE: 1008
  DATA_PATH: data/SA-1B-1P
  BATCH_SIZE: 1
  NUM_SAMPLES: 1

MODEL:
  NAME: EfficientHead2
  BACKBONE: repvit_m1_1
  STUDENT:
    HEAD: efficient_head_v2
    CONV_LAYERS: 2
    CONV_TYPE: standard

TRAIN:
  EPOCHS: 1000
  # Training scales LR by batch_size * world_size / 512; batch size 8 gives an effective 3e-4.
  BASE_LR: 0.512
  WARMUP_LR: 0.0000096
  MIN_LR: 0.000096

SAVE_FREQ: 500
OUTPUT: output/efficientheadv2_samples1