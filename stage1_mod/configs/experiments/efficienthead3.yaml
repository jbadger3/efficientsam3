BASE: ['../base_stage1.yaml']

DATA:
  IMG_SIZE: 1008
  DATA_PATH: data/SA-1B-1P
  BATCH_SIZE: 8
  NUM_SAMPLES: 512

MODEL:
  NAME: EfficientHead3
  BACKBONE: repvit_m1_1
  STUDENT:
    HEAD: efficient_head
    CONV_LAYERS: 1
    CONV_TYPE: depthwise_separable

TRAIN:
  EPOCHS: 1000
  # Training scales LR by batch_size * world_size / 512; batch size 8 gives an effective 3e-4.
  BASE_LR: 0.0192
  WARMUP_LR: 0.0000096
  MIN_LR: 0.000096

SAVE_FREQ: 500
OUTPUT: output/efficienthead3_samples512