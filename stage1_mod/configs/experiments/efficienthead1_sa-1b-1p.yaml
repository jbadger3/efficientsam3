BASE: ['../base_stage1.yaml']

DATA:
  IMG_SIZE: 1008
  DATA_PATH: data/SA-1B-1P
  BATCH_SIZE: 32
  NUM_SAMPLES: -1

MODEL:
  NAME: EfficientHead1
  BACKBONE: repvit_m1_1
  STUDENT:
    HEAD: efficient_head
    CONV_LAYERS: 2
    CONV_TYPE: depthwise_separable

TRAIN:
  EPOCHS: 100
  ACCUMULATION_STEPS: 4
  # Training scales LR by batch_size * world_size / 512; batch size 4 gives an effective 1e-3.
  BASE_LR: 1e-3
  WARMUP_LR: 1e-6
  MIN_LR: 1e-5

SAVE_FREQ: 1
OUTPUT: output/efficienthead1_sa-1b-1p