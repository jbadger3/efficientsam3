# Baseline: original head (final map -> conv head -> bilinear resize to 72x72) at the SAM3 resolution.
BASE: ['../base_stage1.yaml', '../student/baseline_s4_1008.yaml']

MODEL:
  NAME: ES-RV-M-baseline
  BACKBONE: repvit_m1_1

OUTPUT: output/stage1_mod/baseline
TAG: default

DATA:
  IMG_SIZE: 1008
  DATA_PATH: data/SA-1B-1P
  BATCH_SIZE: 8
  NUM_SAMPLES: 512

TRAIN:
  EPOCHS: 1000
  # Training scales LR by batch_size * world_size / 512; batch size 8 gives an effective 3e-4.
  BASE_LR: 0.0192
  WARMUP_LR: 0.0000096
  MIN_LR: 0.000096

SAVE_FREQ: 500
OUTPUT: output/baseline_samples512